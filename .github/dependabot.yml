# Weekly dependency updates, one grouped PR per ecosystem. Major versions are skipped
# until after the launch; security updates are not affected by either setting.
version: 2
updates:
    - package-ecosystem: nuget
      directory: /
      schedule:
          interval: weekly
      groups:
          nuget:
              patterns: ['*']
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns: ['*']
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
